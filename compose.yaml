name: aegistwin-app-v2
services:
  postgres:
    image: postgres:17.4-alpine
    environment:
      POSTGRES_DB: aegistwin
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: ["aegis-data:/var/lib/postgresql/data"]
    networks: [application]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U aegis -d aegistwin"]
      interval: 5s
      retries: 15
  migrate:
    build: .
    command: [alembic, upgrade, head]
    environment: &appenv
      DATABASE_URL: postgresql+psycopg://aegis:${POSTGRES_PASSWORD}@postgres/aegistwin
      SECURE_COOKIES: "false"
    networks: [application]
    depends_on:
      postgres: {condition: service_healthy}
  app:
    build: .
    environment: *appenv
    ports: ["127.0.0.1:8017:8017"]
    networks: [application]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8017/api/health')"]
      interval: 10s
      retries: 5
  worker:
    build: .
    command: [python, -m, backend.worker]
    environment: *appenv
    networks: [application]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      migrate: {condition: service_completed_successfully}
networks:
  application: {internal: true}
volumes:
  aegis-data:

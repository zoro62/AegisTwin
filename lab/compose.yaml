name: aegistwin-isolated-lab-v2
services:
  proxy:
    image: nginxinc/nginx-unprivileged:1.28-alpine
    depends_on: [web]
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    networks: [edge]
    ports: ["127.0.0.1:8097:8080"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  web:
    build: .
    environment: {LAB_NAME: public-demo-app}
    networks: [edge, internal, management, data]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  api:
    build: .
    environment: {LAB_NAME: internal-api}
    networks: [internal, data]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  database:
    build: .
    environment: {LAB_NAME: synthetic-record-store}
    networks: [data]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  admin:
    build: .
    environment: {LAB_NAME: admin-canary}
    networks: [management]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  collector:
    build: .
    environment: {LAB_NAME: telemetry-canary}
    networks: [internal]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
networks:
  edge: {internal: true}
  internal: {internal: true}
  data: {internal: true}
  management: {internal: true}
